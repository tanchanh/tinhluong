<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tính Lương - D.T.Chánh</title>
    <style>
        /* Thiết lập font chữ hệ thống mặc định, không tải từ ngoài */
        :root {
            --primary-color: #69009a;
            --background-color-1: #ffffff;
            --background-color-2: #f9f0fd;
            --background-color-3: #f3f3f3;
            --border-color: #b8b8b8;
            --input-bg: var(--background-color-3);
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            max-width: 30rem;
            margin: 0 auto;
            padding: 1rem;
            /* Padding nhỏ để tận dụng màn hình điện thoại */
            background-color: var(--background-color-1);
            color: #000;
            line-height: 1.5;
        }

        /* Yêu cầu kích thước font */
        h1 {
            font-size: 2rem;
            margin: 0 0 0 0;
            color: var(--primary-color);
            text-transform: uppercase;
            text-align: center;
        }

        h2 {
            font-size: 1.4rem;
            margin: 0 0 0.5rem 0;
            color: var(--primary-color);
            border-left: 0.5rem solid var(--primary-color);
            padding-left: 0.5rem;
        }

        label,
        input,
        span,
        div {
            font-size: 1.1rem;
        }

        /* Bố cục Form nhập liệu */
        .input-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }

        input[type="number"],
        input[type="text"] {
            width: 100%;
            padding: 0.8rem;
            border: 2px solid var(--border-color);
            /* Viền dày 2px theo yêu cầu */
            border-radius: 4px;
            background-color: var(--input-bg);
            box-sizing: border-box;
            /* Đảm bảo padding không làm vỡ khung */
            font-weight: bold;
        }

        input:focus {
            outline: none;
            border-color: var(--primary-color);
            background-color: var(--background-color-1);
        }

        /* Bảng kết quả */
        .result-box {
            border: 2px solid var(--primary-color);
            border-radius: 4px;
            padding: 1rem;
            background-color: var(--background-color-2);
            margin-top: 1rem;
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: .5rem 0;
            border-bottom: 2px dashed var(--border-color);
        }

        .result-item:last-child {
            border-bottom: none;
        }

        .result-value {
            font-weight: bold;
            text-align: right;
        }

        /* Tổng lương nổi bật */
        .total-salary {
            background-color: var(--primary-color);
            color: white;
            padding: 1.5rem 0.5rem;
            margin-top: 1.5rem;
            margin-bottom: 1.5rem; /* Giảm bớt để nhường chỗ cho nút bấm */
            border-radius: 0.4rem;
            text-align: center;
        }

        .total-salary .label {
            display: block;
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
            opacity: 0.9;
        }

        .total-salary .value {
            display: block;
            font-size: 1.7rem;
            font-weight: bold;
        }

        /* Khối nút bấm chức năng */
        .action-buttons-group {
            display: flex;
            gap: 1rem;
            margin-bottom: 4rem;
        }

        .btn-action {
            flex: 1;
            padding: 0.8rem;
            font-size: 1.1rem;
            font-weight: bold;
            background-color: var(--background-color-1);
            color: var(--primary-color);
            border: 2px solid var(--primary-color);
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: all 0.1s ease;
        }

        .btn-action:active {
            background-color: var(--background-color-2);
        }

        /* Giao diện Popup Modal đồng bộ */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease-in-out;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background-color: var(--background-color-1);
            border: 2px solid var(--primary-color);
            border-radius: 8px;
            padding: 1.5rem;
            width: 90%;
            max-width: 24rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            box-sizing: border-box;
        }

        .modal-content h3 {
            margin-top: 0;
            color: var(--primary-color);
            font-size: 1.3rem;
            text-transform: uppercase;
            text-align: center;
            border-bottom: 2px solid var(--background-color-2);
            padding-bottom: 0.5rem;
        }

        .modal-buttons {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .modal-buttons button {
            flex: 1;
            padding: 0.8rem;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.1s ease;
        }

        .btn-confirm {
            background-color: var(--primary-color);
            color: white;
            border: 2px solid var(--primary-color);
        }

        .btn-confirm:active {
            background-color: #500075;
            border-color: #500075;
        }

        .btn-cancel {
            background-color: white;
            color: var(--primary-color);
            border: 2px solid var(--primary-color);
        }

        .btn-cancel:active {
            background-color: var(--background-color-2);
        }

        /* Toast thông báo nhẹ nhàng */
        .toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background-color: #2e7d32;
            color: white;
            padding: 0.8rem 1.5rem;
            border-radius: 4px;
            font-weight: bold;
            z-index: 2000;
            opacity: 0;
            transition: transform 0.3s ease, opacity 0.3s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* Responsive đơn giản */
        @media (min-width: 768px) {
            body {
                padding: 2rem;
            }

            .grid-2-cols {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 1rem;
            }
        }
    </style>
</head>

<body>

    <h1>Tính Lương</h1>
    <div style="text-align: right; font-size: 1.3rem; color: #000000; margin: 0 0 1rem 0;">
        D.T.Chánh</div>

    <div>
        <h2>Nhập Thông Tin</h2>

        <div class="grid-2-cols">
            <div class="input-group">
                <label for="luongCoSo">Lương Cơ Sở (x 1.000 đ)</label>
                <input type="number" id="luongCoSo" value="2530">
            </div>

            <div class="input-group">
                <label for="heSo">Hệ Số Lương</label>
                <input type="number" id="heSo" step="0.01" value="3.96">
            </div>
        </div>

        <div class="grid-2-cols">
            <div class="input-group">
                <label for="ptThamNien">Thâm Niên (%)</label>
                <input type="number" id="ptThamNien" step="1" value="20">
            </div>

            <div class="input-group">
                <label for="ptPhuCap">Phụ Cấp (%)</label>
                <input type="number" id="ptPhuCap" step="1" value="35">
            </div>
        </div>

        <div class="input-group">
            <label for="ptBHXH">Trừ Bảo Hiểm XH (%)</label>
            <input type="number" id="ptBHXH" step="0.5" value="10.5">
        </div>
    </div>

    <div>
        <h2>Kết Quả (x 1.000 đ)</h2>

        <div class="result-box">
            <div class="result-item">
                <span class="result-label">Lương Cơ Bản:</span>
                <span class="result-value" id="kqLuongHeSo"></span>
            </div>

            <div class="result-item">
                <span class="result-label">Thâm Niên:</span>
                <span class="result-value" id="kqThamNien"></span>
            </div>

            <div class="result-item">
                <span class="result-label">Phụ Cấp:</span>
                <span class="result-value" id="kqPhuCap"></span>
            </div>

            <div class="result-item">
                <span class="result-label" style="color: #c0392b;">Trừ Bảo Hiểm:</span>
                <span class="result-value" style="color: #c0392b;" id="kqBHXH"></span>
            </div>
        </div>

        <div class="total-salary">
            <span class="label">TỔNG THỰC LĨNH</span>
            <span class="value" id="kqThucLinh"></span>
        </div>

        <!-- Khối 2 nút bấm nằm ngang -->
        <div class="action-buttons-group">
            <button id="copyBtn" class="btn-action">📋 Sao Chép</button>
            <button id="saveBtn" class="btn-action">💾 Lưu File</button>
        </div>
    </div>

    <!-- Hộp thoại Popup Modal nhập tên đồng bộ -->
    <div id="nameModal" class="modal-overlay">
        <div class="modal-content">
            <h3>Xuất Phiếu Lương</h3>
            <div class="input-group" style="margin-top: 1rem;">
                <label for="modalNameInput">Họ và Tên Người Nhận</label>
                <input type="text" id="modalNameInput" placeholder="">
            </div>
            <div class="modal-buttons">
                <button id="modalCancelBtn" class="btn-cancel">Hủy</button>
                <button id="modalConfirmBtn" class="btn-confirm">Đồng Ý</button>
            </div>
        </div>
    </div>

    <script>
        // Hàm định dạng tiền tệ Việt Nam
        function formatMoney(amount) {
            return Math.round(amount).toLocaleString('vi-VN');
        }

        function calculate() {
            // 1. Lấy giá trị đầu vào
            const heSo = parseFloat(document.getElementById('heSo').value) || 0;
            const luongCoSo = parseFloat(document.getElementById('luongCoSo').value) || 0;
            const ptThamNien = parseFloat(document.getElementById('ptThamNien').value) || 0;
            const ptPhuCap = parseFloat(document.getElementById('ptPhuCap').value) || 0;
            const ptBHXH = parseFloat(document.getElementById('ptBHXH').value) || 0;

            // 2. Tính toán

            // Tiền lương hệ số = Hệ số * Lương cơ sở
            const tienLuongHeSo = heSo * luongCoSo;

            // Tiền thâm niên = Tiền lương hệ số * % Thâm niên
            const tienThamNien = tienLuongHeSo * (ptThamNien / 100);

            // Tiền phụ cấp = Tiền lương hệ số * % Phụ cấp
            const tienPhuCap = tienLuongHeSo * (ptPhuCap / 100);

            // Tổng lương ngạch bậc + thâm niên (Dùng để tính BHXH)
            const tongLuongVaThamNien = tienLuongHeSo + tienThamNien;

            // Tiền BHXH (Tính trên tổng lương + thâm niên)
            const tienBHXH = tongLuongVaThamNien * (ptBHXH / 100);

            // Thực lĩnh = (Lương HS + Thâm niên + Phụ cấp) - BHXH
            const thucLinh = (tienLuongHeSo + tienThamNien + tienPhuCap) - tienBHXH;

            // 3. Hiển thị kết quả
            document.getElementById('kqLuongHeSo').textContent = formatMoney(tienLuongHeSo);
            document.getElementById('kqThamNien').textContent = formatMoney(tienThamNien);
            document.getElementById('kqPhuCap').textContent = formatMoney(tienPhuCap);
            document.getElementById('kqBHXH').textContent = formatMoney(-tienBHXH);
            document.getElementById('kqThucLinh').textContent = formatMoney(thucLinh * 1000) + " đ";
        }

        // Lắng nghe sự kiện thay đổi trên các ô nhập số
        const numInputs = document.querySelectorAll('input[type="number"]');
        numInputs.forEach(input => {
            input.addEventListener('input', calculate);
            input.addEventListener('change', calculate);
        });

        // Tính toán ngay khi mở trang
        calculate();

        // --- CÁC TÍNH NĂNG MỚI ĐƯỢC TÍCH HỢP ---

        let activeAction = null; // Lưu trữ hành động 'copy' hoặc 'save'
        const nameModal = document.getElementById('nameModal');
        const modalNameInput = document.getElementById('modalNameInput');
        const modalConfirmBtn = document.getElementById('modalConfirmBtn');
        const modalCancelBtn = document.getElementById('modalCancelBtn');

        // Hàm lấy ngày xuất phiếu hiện tại theo định dạng DD/MM/YYYY
        function getFormattedDate() {
            const today = new Date();
            const dd = String(today.getDate()).padStart(2, '0');
            const mm = String(today.getMonth() + 1).padStart(2, '0');
            const yyyy = today.getFullYear();
            return `${dd}/${mm}/${yyyy}`;
        }

        // Hàm tạo nội dung văn bản phiếu lương có căn phải số tuyệt đối
        function generateSalarySlipText(name) {
            const heSo = parseFloat(document.getElementById('heSo').value) || 0;
            const luongCoSo = parseFloat(document.getElementById('luongCoSo').value) || 0;
            const ptThamNien = parseFloat(document.getElementById('ptThamNien').value) || 0;
            const ptPhuCap = parseFloat(document.getElementById('ptPhuCap').value) || 0;
            const ptBHXH = parseFloat(document.getElementById('ptBHXH').value) || 0;

            const baseLuongCoSo = Math.round(luongCoSo * 1000);
            const baseTienLuongHeSo = Math.round(heSo * luongCoSo * 1000);
            const baseTienThamNien = Math.round(baseTienLuongHeSo * (ptThamNien / 100));
            const baseTienPhuCap = Math.round(baseTienLuongHeSo * (ptPhuCap / 100));
            const baseTongLuongVaThamNien = baseTienLuongHeSo + baseTienThamNien;
            const baseTienBHXH = Math.round(baseTongLuongVaThamNien * (ptBHXH / 100));
            const baseThucLinh = (baseTienLuongHeSo + baseTienThamNien + baseTienPhuCap) - baseTienBHXH;

            const formatVal = (val) => Math.round(val).toLocaleString('vi-VN');

            // Hàm căn phải: Đảm bảo độ rộng của mỗi dòng luôn cố định là 36 ký tự
            function formatRowRight(label, value, totalWidth = 36) {
                const left = " - " + label + ":";
                const spacesNeeded = totalWidth - left.length - value.length;
                const spaces = " ".repeat(spacesNeeded > 0 ? spacesNeeded : 1);
                return left + spaces + value;
            }

            let text = "=======================================\n";
            text += "            PHIẾU TÍNH LƯƠNG           \n";
            text += "=======================================\n";
            text += ` Họ tên: ${name ? name.toUpperCase() : ""}\n`;
            text += ` Ngày xuất: ${getFormattedDate()}\n`;
            text += "---------------------------------------\n";
            text += " [1] THÔNG SỐ NHẬP VÀO:\n";
            text += formatRowRight("Lương cơ sở", formatVal(baseLuongCoSo) + " đ") + "\n";
            text += formatRowRight("Hệ số lương", heSo.toLocaleString('vi-VN')) + "\n";
            text += formatRowRight("Thâm niên", ptThamNien.toLocaleString('vi-VN') + "%") + "\n";
            text += formatRowRight("Phụ cấp", ptPhuCap.toLocaleString('vi-VN') + "%") + "\n";
            text += formatRowRight("Trừ BHXH", ptBHXH.toLocaleString('vi-VN') + "%") + "\n";
            text += "---------------------------------------\n";
            text += " [2] KẾT QUẢ TÍNH TOÁN:\n";
            text += formatRowRight("Lương cơ bản", formatVal(baseTienLuongHeSo) + " đ") + "\n";
            text += formatRowRight("Tiền thâm niên", formatVal(baseTienThamNien) + " đ") + "\n";
            text += formatRowRight("Tiền phụ cấp", formatVal(baseTienPhuCap) + " đ") + "\n";
            text += formatRowRight("Tiền khấu trừ BH", "-" + formatVal(baseTienBHXH) + " đ") + "\n";
            text += "---------------------------------------\n";
            
            // Căn phải cho dòng Tổng Thực Lĩnh
            const totalLabel = " TỔNG THỰC LĨNH:";
            const totalVal = formatVal(baseThucLinh) + " đ";
            const totalSpacesNeeded = 36 - totalLabel.length - totalVal.length;
            const totalSpaces = " ".repeat(totalSpacesNeeded > 0 ? totalSpacesNeeded : 1);
            text += totalLabel + totalSpaces + totalVal + "\n";
            
            text += "=======================================";

            return text;
        }

        // Hiện Toast thông báo mượt mà
        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => { toast.classList.add('show'); }, 50);
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => { toast.remove(); }, 300);
            }, 2500);
        }

        // Quản lý Modal
        function openModal(action) {
            activeAction = action;
            modalNameInput.value = ""; // Xoá sạch khung nhập
            nameModal.classList.add('active');
            modalNameInput.focus();
        }

        function closeModal() {
            nameModal.classList.remove('active');
            activeAction = null;
        }

        modalCancelBtn.addEventListener('click', closeModal);
        nameModal.addEventListener('click', (e) => {
            if (e.target === nameModal) closeModal();
        });

        // Xử lý khi người dùng đồng ý xuất phiếu
        modalConfirmBtn.addEventListener('click', () => {
            const name = modalNameInput.value.trim();
            // Không bắt buộc nhập tên - Proceed trực tiếp dù trống

            const slipText = generateSalarySlipText(name);

            if (activeAction === 'copy') {
                navigator.clipboard.writeText(slipText).then(() => {
                    showToast('✔ Đã sao chép phiếu lương!');
                }).catch(err => {
                    console.error('Lỗi sao chép: ', err);
                });
            } else if (activeAction === 'save') {
                // Thêm ký tự BOM "\uFEFF" để tệp TXT nhận đúng định dạng UTF-8 trên Windows
                const blob = new Blob(["\uFEFF" + slipText], { type: 'text/plain;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                // Nếu không có tên, đặt tên file mặc định là Phieu_Luong.txt
                const safeName = name ? name.replace(/[^a-zA-Z0-9\sàáạảãâầấậẩẫăằắặẳẵèéẹẻẽêềếệểễìíịỉĩòóọỏõôồốộổỗơờớợởỡùúụủũưừứựửữỳýỵỷỹđ]/gi, '').replace(/\s+/g, '_') : '';
                a.download = safeName ? `Phieu_Luong_${safeName}.txt` : `Phieu_Luong.txt`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showToast('💾 Đã lưu tệp phiếu lương!');
            }
            closeModal();
        });

        // Sự kiện gán vào hai nút bấm chính
        document.getElementById('copyBtn').addEventListener('click', () => { openModal('copy'); });
        document.getElementById('saveBtn').addEventListener('click', () => { openModal('save'); });
    </script>
</body>

</html>
