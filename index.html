<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tính Lương - D.T.Chánh</title>
    <style>
        /* Thiết lập font chữ hệ thống mặc định, không tải từ ngoài */
        :root {
            --primary-color: #0056b3;
            --border-color: #333;
            --bg-color: #ffffff;
            --input-bg: #f8f9fa;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 10px; /* Padding nhỏ để tận dụng màn hình điện thoại */
            background-color: var(--bg-color);
            color: #000;
            line-height: 1.5;
        }

        /* Yêu cầu kích thước font */
        h1 {
            font-size: 1.5rem;
            margin: 0 0 20px 0;
            color: var(--primary-color);
            text-transform: uppercase;
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 5px;
        }

        h2 {
            font-size: 1.4rem;
            margin: 25px 0 15px 0;
            color: #333;
            border-left: 5px solid var(--primary-color);
            padding-left: 10px;
        }

        h3 {
            font-size: 1.3rem;
            margin: 15px 0;
            color: #444;
        }

        p, label, input, span, div {
            font-size: 1.1rem;
        }

        /* Bố cục Form nhập liệu */
        .input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
        }

        input[type="number"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #555; /* Viền dày 2px theo yêu cầu */
            border-radius: 4px;
            background-color: var(--input-bg);
            box-sizing: border-box; /* Đảm bảo padding không làm vỡ khung */
            font-weight: 500;
        }

        input:focus {
            outline: none;
            border-color: var(--primary-color);
            background-color: #fff;
        }

        /* Bảng kết quả */
        .result-box {
            border: 2px solid #555;
            border-radius: 4px;
            padding: 15px;
            background-color: #f0fdf4;
            margin-top: 10px;
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px dashed #ccc;
        }

        .result-item:last-child {
            border-bottom: none;
        }

        .result-label {
            font-weight: normal;
            font-weight: bold;
        }

        .result-value {
            font-weight: bold;
            text-align: right;
        }

        /* Tổng lương nổi bật */
        .total-salary {
            background-color: #0056b3;
            color: white;
            padding: 15px;
            margin-top: 20px;
            border-radius: 4px;
            text-align: center;
            border: 2px solid #004494;
        }

        .total-salary .label {
            display: block;
            font-size: 1.2rem;
            margin-bottom: 5px;
            opacity: 0.9;
        }

        .total-salary .value {
            display: block;
            font-size: 2rem;
            font-weight: bold;
        }

        /* Responsive đơn giản */
        @media (min-width: 768px) {
            body {
                padding: 20px;
            }
            .grid-2-cols {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 20px;
            }
        }

        .gioi-thieu {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;            
        }
    </style>
</head>
<body>

    <h1 align="center">Tính Lương 2026</h1>

    <div class="input-section">
        <h2>1. Nhập Thông Tin</h2>
        
        <div class="grid-2-cols">
            <div class="input-group">
                <label for="luongCoSo">Lương Cơ Sở (x 1.000 đồng)</label>
                <input type="number" id="luongCoSo" value="2340">
            </div>          

            <div class="input-group">
                <label for="heSo">Hệ Số Lương</label>
                <input type="number" id="heSo" step="0.01" value="3.96">
            </div>            
        </div>

        <div class="grid-2-cols">
            <div class="input-group">
                <label for="ptThamNien">% Thâm Niên</label>
                <input type="number" id="ptThamNien" step="1" value="19">
            </div>

            <div class="input-group">
                <label for="ptPhuCap">% Phụ Cấp (Ưu đãi, Chức vụ...)</label>
                <input type="number" id="ptPhuCap" step="1" value="35">
            </div>
        </div>

        <div class="input-group">
            <label for="ptBHXH">% Bảo Hiểm Xã Hội</label>
            <input type="number" id="ptBHXH" step="0.5" value="10.5">
        </div>
    </div>

    <div class="result-section">
        <h2>2. Kết Quả (x 1.000 đ)</h2>
        
        <div class="result-box">
            <div class="result-item">
                <span class="result-label">Lương Theo Hệ Số:</span>
                <span class="result-value" id="kqLuongHeSo">0</span>
            </div>
            
            <div class="result-item">
                <span class="result-label">Tiền Thâm Niên:</span>
                <span class="result-value" id="kqThamNien">0</span>
            </div>

            <div class="result-item">
                <span class="result-label">Tiền Phụ Cấp:</span>
                <span class="result-value" id="kqPhuCap">0</span>
            </div>

            <div class="result-item">
                <span class="result-label" style="color: #c0392b;">Trừ Bảo Hiểm XH:</span>
                <span class="result-value" style="color: #c0392b;" id="kqBHXH">0</span>
            </div>
        </div>

        <div class="total-salary">
            <span class="label">TỔNG THỰC LĨNH</span>
            <span class="value" id="kqThucLinh">0 đ</span>
        </div>
    </div>
    <div class="gioi-thieu">
        <span class="label">D.T.Chánh</span>
        <span class="label">0913.150.370</span>
    </div>    
    <script>
        // Hàm định dạng tiền tệ Việt Nam
        function formatMoney(amount) {
            return Math.round(amount).toLocaleString('vi-VN');
        }

        function calculate() {
            // 1. Lấy giá trị đầu vào
            const heSo = parseFloat(document.getElementById('heSo').value) || 0;
            const luongCoSo = parseFloat(document.getElementById('luongCoSo').value) || 0;
            const ptThamNien = parseFloat(document.getElementById('ptThamNien').value) || 0;
            const ptPhuCap = parseFloat(document.getElementById('ptPhuCap').value) || 0;
            const ptBHXH = parseFloat(document.getElementById('ptBHXH').value) || 0;

            // 2. Tính toán
            
            // Tiền lương hệ số = Hệ số * Lương cơ sở
            const tienLuongHeSo = heSo * luongCoSo;

            // Tiền thâm niên = Tiền lương hệ số * % Thâm niên
            const tienThamNien = tienLuongHeSo * (ptThamNien / 100);

            // Tiền phụ cấp = Tiền lương hệ số * % Phụ cấp
            const tienPhuCap = tienLuongHeSo * (ptPhuCap / 100);

            // Tổng lương ngạch bậc + thâm niên (Dùng để tính BHXH)
            const tongLuongVaThamNien = tienLuongHeSo + tienThamNien;

            // Tiền BHXH (Tính trên tổng lương + thâm niên)
            const tienBHXH = tongLuongVaThamNien * (ptBHXH / 100);

            // Thực lĩnh = (Lương HS + Thâm niên + Phụ cấp) - BHXH
            const thucLinh = (tienLuongHeSo + tienThamNien + tienPhuCap) - tienBHXH;

            // 3. Hiển thị kết quả
            document.getElementById('kqLuongHeSo').textContent = formatMoney(tienLuongHeSo);
            document.getElementById('kqThamNien').textContent = formatMoney(tienThamNien);
            document.getElementById('kqPhuCap').textContent = formatMoney(tienPhuCap);
            document.getElementById('kqBHXH').textContent = formatMoney(tienBHXH);
            document.getElementById('kqThucLinh').textContent = formatMoney(thucLinh*1000) + " đ";
        }

        // Lắng nghe sự kiện thay đổi trên tất cả các ô input
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('input', calculate);
            input.addEventListener('change', calculate); // Cho chắc chắn trên mobile
        });

        // Tính toán ngay khi mở trang
        calculate();
    </script>
</body>
</html>
